<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Clicker</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #fff; }
  main { text-align: center; background: #16213e; padding: 2rem 3rem; border-radius: 12px; }
  .castle { font-size: 4rem; }
  #score { font-size: 2.5rem; margin: 0.5rem 0; }
  button { font-size: 1.2rem; padding: 0.6rem 1.5rem; border: none; border-radius: 8px; background: #8b5cf6; color: #fff; cursor: pointer; }
  button:hover { background: #7c3aed; }
</style>
</head>
<body>
<main data-checkpoint-smoke="violet-lantern" data-late-edit="checkpoint-after-build">
  <div class="castle" aria-hidden="true">🏰</div>
  <h1>Castle Clicker</h1>
  <p>Score: <span id="score">0</span></p>
  <button id="add-btn" type="button">Add point</button>
</main>
<script>
  (function () {
    var score = 0;
    var scoreEl = document.getElementById('score');
    document.getElementById('add-btn').addEventListener('click', function () {
      score += 1;
      scoreEl.textContent = String(score);
    });
  })();
</script>
</body>
</html>
